services:
  - type: web
    name: hospital-equipment-inventory-sys
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOAD_ROOT_DIR
        value: ./uploads
